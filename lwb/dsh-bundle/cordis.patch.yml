# LWB is a DSH bundle. It extends the official Web composition through the
# same Cordis patch mechanism used by upstream bundles.

- insert:
    - id: lwb-profile
      name: '@scitiger-ai/lwb-dsh-bundle'
      config:
        name: 老傅工作台
        # No version here on purpose. The product version has exactly two
        # sources: `build.json` inside a packaged build, and `package.json` in a
        # checkout. A copy in this file would be a third one, and the one nobody
        # bumps when a release is cut.

    # Browser half of the product shell. It is deliberately a normal DSH
    # client package, so the module graph and the official runtime own loading.
    - id: lwb-client
      name: '@scitiger-ai/lwb-dsh-bundle'
      config:
        clientOnly: true

# LWB owns the complete sidebar. Disable the unused upstream sidebar owner so
# the two owners cannot compete for the same primary slot. The native Settings
# seat and sidebar directory-flow seat are declared by the LWB overlay instead.
# DSH activates its directory picker only when both workspace flow seats exist.
- id: ui-sidebar
  disabled: true

- id: ui-brand-official
  disabled: true

# ui-plugin-manager deliberately stays enabled: the Plugins page is an official
# `main` panel, and its sidebar row is filled by the conversation module, whose
# column declares `sidebar.panellist` on the LWB overlay entry. LWB owns only
# the product navigation (`sidebar`), not the official panel rows.

# The official Desktop now binds a local Web Host. Keep LWB separate from
# an independently installed official Desktop without changing its source.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js "process.env.LWB_PROFILE_ID === 'desktop' ? Number(process.env.LWB_DESKTOP_PORT || 19487) : (ctx.webStartup.port ?? 3080)"
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Default only: native volatile settings persist user overrides in the profile.
- id: ui-theme
  config:
    preference: light

# Web search / fetch routing. The seam takes ONE provider id per capability and
# resolves it per call, so `lwb-web` decides inside the provider whether the
# current session's model route is DeepSeek's own account (call DeepSeek
# directly with the account sign-in) or anything else (call the LWB ATS with
# points billing). Pinning the id here keeps the built-in providers registered
# but unused, so switching back is a config change, not a code change.
- id: web
  config:
    searchProvider: lwb-web
    fetchProvider: lwb-web
